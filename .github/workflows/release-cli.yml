name: 发布 Go TUI 二进制

# 独立于内核构建：推送 master / 手动触发时构建并发布 bbrv3 CLI 二进制，
# 供 `bbr` 快捷命令使用（固定 tag bbrv3-cli，资产每次覆盖上传，
# release 说明同步刷新为 .github/RELEASE_NOTES_cli.md）。
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbrv3-cli-release
  cancel-in-progress: true

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          # 从 go.mod 读取精确版本（go 1.26.7），避免 '1.26' 解析到旧补丁版
          go-version-file: go.mod

      - name: 构建二进制
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/MinimaxFlora/Linux-BBR-v3/internal/app.Version=v1.0.0 -X github.com/MinimaxFlora/Linux-BBR-v3/internal/app.Commit=${GITHUB_SHA::8}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o bbrv3-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o bbrv3-linux-arm64 .

      - name: 发布或更新 bbrv3-cli release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view bbrv3-cli >/dev/null 2>&1; then
            gh release upload bbrv3-cli bbrv3-linux-amd64 bbrv3-linux-arm64 --clobber
            # 每次推送同步刷新 release 说明（固定 tag 无法比版本号，以说明记录更新历史）
            gh release edit bbrv3-cli --notes-file .github/RELEASE_NOTES_cli.md
          else
            gh release create bbrv3-cli \
              --title "BBRv3 Go TUI" \
              --notes-file .github/RELEASE_NOTES_cli.md \
              bbrv3-linux-amd64 bbrv3-linux-arm64
          fi
